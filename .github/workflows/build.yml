name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest

        - name: Android32
          os: ubuntu-latest
          target: Android32

        - name: Android64
          os: ubuntu-latest
          target: Android64

        - name: macOS
          os: macos-latest

        - name: iOS
          os: macos-latest
          target: iOS

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: ./.github/actions/build-geode-mod
        with:
          sdk: v5.11.2
          bindings: geode-sdk/bindings
          bindings-ref: main
          combine: true
          target: ${{ matrix.config.target }}
          # Disable the flaky sccache download in CI; compile without a compiler cache.
          ccache-variant: ""
  
  test-dedicated-server:
    name: Dedicated server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        working-directory: servers/multiplayer/dedicated
        run: |
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
          node --check --input-type=module < ../signaling/worker.js
      - name: Run dedicated server tests
        working-directory: servers/multiplayer/dedicated
        run: npm test

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build', 'test-dedicated-server']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
